spring:
  application:
    name: order-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/order_management}
    username: ${SPRING_DATASOURCE_USERNAME:order_management}
    password: ${SPRING_DATASOURCE_PASSWORD}
  messages:
    fallback-to-system-locale: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  i18n:
    default-locale: ${APP_DEFAULT_LOCALE:en}
    supported-locales: ${APP_SUPPORTED_LOCALES:en}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
